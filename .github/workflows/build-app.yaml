# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file ./quarkus-demo-app/pom.xml

    - name: List files in the output target directory
      run: |
        ls ${{ github.workspace }}/quarkus-demo-app/target

    - name: Log in to Quay.io
      uses: docker/login-action@v3
      with:
# Create the following on GitHub: Project Repository > Settings > Secrets and variables > Actions
# Repository secret name: QUAY_ROBOT_TOKEN
# Repository variable name: QUAY_USERNAME
# Reference: https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets#creating-secrets-for-a-repository
        registry: quay.io
        username: ${{ vars.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_ROBOT_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./quarkus-demo-app
        file: ./quarkus-demo-app/src/main/docker/Dockerfile.jvm
        # This is the default architecture
        platforms: linux/amd64
        push: true
        tags: |
          quay.io/${{ vars.QUAY_USERNAME }}/quarkus-demo-app:${{ github.sha }}
          quay.io/${{ vars.QUAY_USERNAME }}/quarkus-demo-app:latest
        # Pulls existing cached layers directly from the repository's GitHub Actions cache storage
        #cache-from: type=gha
        #
        # Writes build layers back to GitHub Actions (gha) cache storage.
        # Setting mode=max instructs BuildKit to cache intermediate build stages (crucial for multi-stage Quarkus Dockerfiles),
        # rather than only the final output image layers.
        #cache-to: type=gha,mode=max

